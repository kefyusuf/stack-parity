packages:
  - "packages/*"
  - "services/*"

# pnpm 11 requires an explicit policy for dependency lifecycle scripts.
# These two packages were the only blocked builds in the Docker install log.
# Keep strict behavior for any future unreviewed dependency.
strictDepBuilds: true
allowBuilds:
  esbuild: true
  workerd: true

# SPIKE-001: keep Composer 0.25.0 / Alchemy on one Effect RC release.
# Current pnpm peer resolution otherwise combines @effect/platform-node@rc.115
# with effect@4.0.3, which breaks Prisma's config evaluation (Cookies.js).
# This pin set is temporary and must be revisited with any Composer upgrade.
overrides:
  effect: 4.0.0-rc.115
  '@effect/platform-node-shared': 4.0.0-rc.115
  '@effect/sql-d1': 4.0.0-rc.115
  '@effect/sql-sqlite-do': 4.0.0-rc.115
  '@effect/vitest': 4.0.0-rc.115
